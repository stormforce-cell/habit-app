<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>毎日</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="毎日">
<meta name="theme-color" content="#f6f5f2">
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#1c1c1e; --sub:#8e8e93; --line:#e8e6e1; --soft:#efede8;
  --work:#2f6fed; --life:#f08a24; --other:#8e8e93; --ok:#2fa36b; --now:#ff3b30; --acc:#2f6fed;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.04);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111113; --card:#1c1c1f; --ink:#f2f2f4; --sub:#8e8e93; --line:#2c2c30; --soft:#232327;
    --work:#5b8cff; --life:#ffa040; --ok:#3cc47e; --acc:#5b8cff; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#111113; --card:#1c1c1f; --ink:#f2f2f4; --sub:#8e8e93; --line:#2c2c30; --soft:#232327;
  --work:#5b8cff; --life:#ffa040; --ok:#3cc47e; --acc:#5b8cff; --shadow:none;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",sans-serif;
  -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
main{max-width:560px;margin:0 auto;padding:12px 16px calc(96px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
svg{display:block}

/* 下のタブ（3つ） */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs a{flex:1;max-width:160px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:10px;color:var(--sub);text-decoration:none}
nav.tabs a.on{color:var(--acc)}
nav.tabs svg{width:26px;height:26px}

/* 見出し */
.top{display:flex;align-items:center;gap:14px;margin:6px 2px 14px}
.top .date{flex:1}
.top .date b{display:block;font-size:30px;font-weight:800;letter-spacing:.01em;line-height:1.1}
.top .date span{font-size:14px;color:var(--sub);font-weight:600}
.ring{width:52px;height:52px;position:relative;flex:none}
.ring svg{width:52px;height:52px;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.sync{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;align-self:flex-start;margin-top:8px}
.sync.wait{background:var(--life)} .sync.err{background:var(--now)}

/* 追加欄 */
.add{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:6px 6px 6px 10px;box-shadow:var(--shadow);margin-bottom:14px}
.add .tagdot{width:34px;height:34px;border-radius:10px;border:0;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800}
.add input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:17px;color:var(--ink);padding:10px 2px;outline:none}
.add input::placeholder{color:var(--sub)}
.add .go{width:40px;height:40px;border-radius:12px;border:0;background:var(--acc);color:#fff;flex:none;display:flex;align-items:center;justify-content:center}
.add .go svg{width:22px;height:22px}
.add .more{width:36px;height:40px;border:0;background:none;color:var(--sub);flex:none;display:flex;align-items:center;justify-content:center}
.add .more svg{width:22px;height:22px}

/* セクション見出し */
.sec{display:flex;align-items:center;gap:8px;margin:20px 4px 8px;color:var(--sub);font-size:13px;font-weight:700}
.sec .cnt{background:var(--soft);border-radius:999px;padding:1px 8px;font-size:12px}
.sec .plus{margin-left:auto;width:30px;height:30px;border-radius:9px;border:0;background:var(--soft);color:var(--sub);display:flex;align-items:center;justify-content:center}
.sec .plus svg{width:18px;height:18px}

/* タスクの行 */
.list{display:flex;flex-direction:column;gap:8px;min-height:8px}
.row{position:relative;display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px 12px 12px 16px;box-shadow:var(--shadow);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:pan-y;overflow:hidden}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--tc,var(--other))}
.row .chk{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--tc,var(--other));flex:none;background:none;padding:0;display:flex;align-items:center;justify-content:center;color:#fff}
.row .chk svg{width:16px;height:16px;opacity:0}
.row.done .chk{background:var(--tc,var(--other))}
.row.done .chk svg{opacity:1}
.row .t{flex:1;min-width:0;font-size:16px;line-height:1.35;word-break:break-word}
.row.done .t{color:var(--sub);text-decoration:line-through}
.row .time{flex:none;font-size:13px;font-weight:800;color:var(--tc,var(--other));background:var(--soft);background:color-mix(in srgb,var(--tc,var(--other)) 12%,transparent);border-radius:8px;padding:4px 7px;font-variant-numeric:tabular-nums}
.row .ico{flex:none;color:var(--sub);display:flex;align-items:center;gap:3px;font-size:12px;font-weight:700}
.row .ico svg{width:16px;height:16px}
.row.preview{opacity:.5;box-shadow:none;border:1.5px dashed var(--line);background:transparent}
.row.preview::before{display:none}
.row.now{outline:2px solid var(--now);outline-offset:-2px}
.row.ghost{opacity:.25}
.lift{position:fixed;left:0;z-index:50;pointer-events:none;transform:scale(1.03);box-shadow:0 14px 34px rgba(0,0,0,.22)!important;transition:transform .12s}
.donebtn{display:flex;align-items:center;gap:6px;margin:14px auto 0;border:0;background:var(--soft);color:var(--sub);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700}
.donebtn svg{width:16px;height:16px}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--sub);font-size:14px;padding:22px 0}
.empty svg{width:40px;height:40px;opacity:.5}

/* 明日の繰り返し（小さく） */
.pvs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;color:var(--sub)}
.pvs svg{width:16px;height:16px;margin-right:2px}
.pv{font-size:13px;font-weight:600;border-radius:999px;padding:4px 10px;background:var(--soft);background:color-mix(in srgb,var(--tc) 12%,transparent);color:var(--tc)}
.pastlist .row.done .t{text-decoration:none;color:var(--ink)}
.adm{font-size:11px;font-weight:800;color:var(--sub);text-align:center;padding:3px 0;cursor:pointer;background:var(--soft);border-radius:5px}

/* IF-THEN */
.row .t .if{display:flex;align-items:baseline;gap:6px;font-size:12px;color:var(--sub);line-height:1.35;margin-bottom:2px}
.row .t .then{display:flex;align-items:baseline;gap:6px}
.row .t b{flex:none;font-size:10px;font-weight:800;letter-spacing:.04em;border-radius:5px;padding:1px 5px;color:var(--tc,var(--other));background:var(--soft);background:color-mix(in srgb,var(--tc,var(--other)) 12%,transparent)}
.row.done .t .then{text-decoration:line-through}
.pastlist .row.done .t .then{text-decoration:none}
.ifrow,.ttlrow{display:flex;align-items:center;gap:8px}
.ifrow{margin:4px 2px 0}
.ifrow b,.ttlrow b{flex:none;font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px;background:var(--soft);color:var(--acc)}
.ifrow input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);padding:8px 2px;outline:none}
.ttlrow .ttl{flex:1;min-width:0}

/* メモ（常に表示） */
.row .t .memo{font-size:12.5px;line-height:1.45;color:var(--sub);margin-top:4px;white-space:pre-wrap;word-break:break-word;text-decoration:none}
.row.done .t .memo{text-decoration:none}

/* 案件 */
.row .t .case{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--tc,var(--sub));margin-bottom:2px}
.row .t .case svg{width:13px;height:13px}
.row.hold{box-shadow:none;background:transparent;border:1.5px dashed var(--line)}
.row.hold .holdic{width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--sub);display:flex;align-items:center;justify-content:center;flex:none}
.row.hold .holdic svg{width:14px;height:14px}
.sec svg{width:15px;height:15px}
.chip.tocase{flex:none;font-size:12px;padding:6px 10px}
.chip.tocase svg{width:14px;height:14px}
.casehead{width:34px;height:34px;border-radius:10px;background:var(--soft);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:none}
.casehead svg{width:20px;height:20px}
.cprog{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin:0 2px 10px}
.cprog i{display:block;height:100%;background:var(--ok)}
.blk.steps{padding:4px 8px}
.stp{display:flex;align-items:center;gap:6px;min-height:46px;border-bottom:1px solid var(--line)}
.stp:last-child{border-bottom:0}
.stp input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);padding:8px 2px;outline:none}
.sdue{position:relative;flex:none;display:flex;align-items:center;gap:3px;height:30px;padding:0 8px;border-radius:9px;background:var(--soft);color:var(--sub);font-size:12px;font-weight:700}
.sdue.on{color:var(--life)}
.sdue svg{width:14px;height:14px}
.sdue input{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0;border:0}
.stp.done input{color:var(--sub);text-decoration:line-through}
.stp.cur{background:color-mix(in srgb,var(--acc) 7%,transparent);border-radius:10px}
.schk{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--sub);background:none;padding:0;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.schk svg{width:14px;height:14px;opacity:0}
.stp.done .schk{background:var(--ok);border-color:var(--ok)}
.stp.done .schk svg{opacity:1}
.schk.ghost{border-style:dashed;opacity:.4}
.skind{width:30px;height:30px;border-radius:9px;border:0;background:var(--soft);color:var(--acc);flex:none;display:flex;align-items:center;justify-content:center}
.skind.w{color:var(--life)}
.skind svg{width:15px;height:15px}
.sbtn{width:30px;height:30px;border:0;background:none;color:var(--sub);flex:none;display:flex;align-items:center;justify-content:center}
.sbtn svg{width:16px;height:16px}

/* 案件シート（画面いっぱい・折り返し） */
.sheet.tall{height:calc(100vh - 16px);height:calc(100dvh - env(safe-area-inset-top,0px) - 10px)}
.stp{align-items:flex-start;padding:8px 0}
.stp .schk,.stp .skind{margin-top:4px}
.sbody{flex:1;min-width:0}
.stt,.snote{display:block;width:100%;border:0;background:none;font:inherit;color:var(--ink);resize:none;overflow:hidden;outline:none;padding:6px 2px;line-height:1.4}
.stt{font-size:16px}
.stp.done .stt{color:var(--sub);text-decoration:line-through}
.snote{font-size:14px;color:var(--sub);background:var(--soft);border-radius:9px;padding:7px 9px;margin-top:4px}
.smeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.smeta .sp{flex:1}
.sdate{position:relative;display:flex;align-items:center;gap:4px;height:30px;padding:0 10px;border-radius:9px;background:var(--soft);color:var(--sub);font-size:12.5px;font-weight:700}
.sdate.on{color:var(--acc)}
.sdate.w.on{color:var(--life)}
.sdate svg{width:14px;height:14px}
.sdate input{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0;border:0}
.ln textarea{overflow:hidden}

/* シート */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:calc(100vh - 16px);max-height:calc(100dvh - env(safe-area-inset-top,0px) - 10px);overflow:auto;-webkit-overflow-scrolling:touch;border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.grab{width:44px;height:5px;background:var(--line);border-radius:3px;margin:0 auto}
.shead{position:sticky;top:-10px;z-index:3;background:var(--bg);display:flex;align-items:center;justify-content:center;height:44px;margin:-10px -16px 6px;padding:0 16px;touch-action:none;cursor:grab}
.sclose{position:absolute;right:12px;top:6px;width:34px;height:34px;border-radius:50%;border:0;background:var(--soft);color:var(--sub);display:flex;align-items:center;justify-content:center}
.sclose svg{width:18px;height:18px}
.ln.wrap{flex-wrap:wrap;padding:4px 0}
.ln.wrap .chips{flex:none}
.ln.wrap input[type=date]{min-width:150px;min-height:38px}
.ttl{width:100%;border:0;background:none;font:inherit;font-size:22px;font-weight:800;color:var(--ink);padding:6px 2px 10px;outline:none}
.blk{background:var(--card);border-radius:14px;padding:4px 12px;margin-bottom:10px;box-shadow:var(--shadow)}
.ln{display:flex;align-items:center;gap:10px;min-height:48px;border-bottom:1px solid var(--line)}
.ln:last-child{border-bottom:0}
.ln>svg{width:22px;height:22px;color:var(--sub);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;padding:6px 0}
.chip{border:0;background:var(--soft);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--bg)}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.ln input[type=date],.ln input[type=time],.ln input[type=number],.ln input[type=text],.ln textarea{border:0;background:var(--soft);border-radius:9px;padding:8px 10px;font:inherit;font-size:16px;color:var(--ink);outline:none}
.ln input[type=text],.ln textarea{flex:1;min-width:0}
.ln textarea{min-height:64px;resize:vertical;margin:6px 0}
.ln input[type=number]{width:70px}
.ln .lab{font-size:14px;color:var(--sub)}
.acts{display:flex;gap:10px;margin-top:6px}
.acts button{border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:800}
.acts .del{background:var(--soft);color:var(--now);width:56px;display:flex;align-items:center;justify-content:center}
.acts .del svg{width:22px;height:22px}
.acts .save{flex:1;background:var(--acc);color:#fff}

/* カレンダー */
.cal-top{display:flex;align-items:center;gap:6px;margin:6px 2px 10px}
.cal-top b{flex:1;font-size:24px;font-weight:800}
.ib{width:38px;height:38px;border-radius:11px;border:0;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:13px;font-weight:800}
.ib svg{width:20px;height:20px}
.ib.wide{width:auto;padding:0 12px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;color:var(--sub);font-size:13px;font-weight:700;padding:7px 0;border-radius:9px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.month{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.month .wd{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:var(--sub);text-align:center;padding:7px 0;font-weight:700}
.month .grid{display:grid;grid-template-columns:repeat(7,1fr)}
.month .cell{min-height:78px;border-top:1px solid var(--line);padding:3px 2px;overflow:hidden;cursor:pointer}
.month .dn{font-size:12px;text-align:center;margin-bottom:2px;font-weight:600}
.month .cell.other{opacity:.35}
.month .cell.today .dn span{background:var(--acc);color:#fff;border-radius:999px;padding:1px 6px}
.month .ech{font-size:10px;line-height:1.4;border-radius:4px;padding:0 3px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;background:var(--tc)}
.month .ech.done{opacity:.4;text-decoration:line-through}
.month .more{font-size:10px;color:var(--sub);text-align:center}
.tl-wrap{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.tl-days{display:flex;padding-left:42px;border-bottom:1px solid var(--line)}
.tl-days .d{flex:1;text-align:center;padding:6px 0;font-size:11px;color:var(--sub);font-weight:700;cursor:pointer}
.tl-days .d b{display:block;font-size:19px;color:var(--ink)}
.tl-days .d.today b{color:var(--acc)}
.tl-allday{display:flex;padding-left:42px;border-bottom:1px solid var(--line);min-height:6px}
.tl-allday .col{flex:1;padding:3px 2px;min-width:0}
.tl-allday .ech{font-size:11px;border-radius:5px;padding:3px 5px;margin-bottom:2px;color:#fff;background:var(--tc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tl-allday .ech.done{opacity:.4;text-decoration:line-through}
.tl-scroll{height:64vh;overflow-y:auto;position:relative}
.tl{position:relative;display:flex}
.tl .hours{width:42px;flex:none}
.tl .hours div{height:52px;font-size:10px;color:var(--sub);text-align:right;padding-right:6px;transform:translateY(-6px)}
.tl .col{flex:1;position:relative;border-left:1px solid var(--line);min-width:0}
.tl .col .hl{height:52px;border-top:1px solid var(--line)}
.tl .ev{position:absolute;border-radius:7px;padding:3px 6px;font-size:11px;line-height:1.3;color:#fff;overflow:hidden;cursor:pointer;background:var(--tc);border:1px solid var(--card)}
.tl .ev b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .ev.done{opacity:.4;text-decoration:line-through}
.tl .nowline{position:absolute;left:0;right:0;height:2px;background:var(--now);z-index:3}
.tl .nowline::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--now)}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(78px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;border:0;background:var(--acc);color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.2);z-index:16;display:flex;align-items:center;justify-content:center}
.fab svg{width:28px;height:28px}

/* やったこと（ゲーム） */
.hero{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#2f6fed,#7b4dff 60%,#f08a24);color:#fff;border-radius:22px;padding:18px;margin:6px 0 12px;box-shadow:0 10px 26px rgba(47,111,237,.3)}
.lvbadge{width:76px;height:76px;border-radius:22px;background:rgba(255,255,255,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;border:2px solid rgba(255,255,255,.5)}
.lvbadge small{font-size:12px;font-weight:800;opacity:.85;line-height:1}
.lvbadge b{font-size:36px;font-weight:900;line-height:1}
.hx{flex:1;min-width:0}
.lvname{font-size:20px;font-weight:900;letter-spacing:.04em}
.xpbar{height:12px;border-radius:6px;background:rgba(255,255,255,.25);overflow:hidden;margin:8px 0 5px}
.xpbar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#ffe066,#fff);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.xpnum{font-size:12px;font-weight:800;opacity:.9;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tile{position:relative;background:var(--card);border-radius:16px;padding:10px 10px 9px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:1px}
.tile span{font-size:11px;font-weight:800;color:var(--sub)}
.tile b{font-size:26px;font-weight:900;line-height:1.15;font-variant-numeric:tabular-nums}
.tile small{font-size:11px;font-weight:700;color:var(--sub)}
.tile small.up{color:var(--ok)} .tile small.down{color:var(--now)}
.tile.today b{color:var(--acc)}
.tile.fire.on{background:linear-gradient(160deg,#fff4e5,var(--card))}
.tile em{position:absolute;top:-8px;right:-4px;font-style:normal;font-size:10px;font-weight:900;background:#ffcc00;color:#000;border-radius:999px;padding:2px 7px;transform:rotate(6deg)}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:4px;background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--soft);cursor:pointer}
.heat i.fut{background:transparent;cursor:default}
.heat i.h1{background:#c6efd6} .heat i.h2{background:#7fd6a2} .heat i.h3{background:#34b56c} .heat i.h4{background:#147a43}
.heat i.now{outline:2px solid var(--acc);outline-offset:1px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bd{background:var(--card);border-radius:16px;padding:12px 6px 10px;text-align:center;box-shadow:var(--shadow);opacity:.55}
.bd.got{opacity:1}
.bd.neu{animation:pop .8s ease-out 2;outline:2px solid #ffcc00}
.bi{font-size:30px;line-height:1.2;filter:grayscale(1)}
.bd.got .bi{filter:none}
.bn{font-size:11px;font-weight:800;color:var(--sub);margin-top:3px}
.bd.got .bn{color:var(--ink)}
.bp{height:4px;border-radius:2px;background:var(--soft);margin:6px 10px 0;overflow:hidden}
.bp i{display:block;height:100%;background:var(--acc)}
.dxp{color:var(--acc)!important;font-weight:900!important}
.day-h .pf{font-size:16px}
.xpc{flex:none;font-size:12px;font-weight:900;color:var(--acc);background:var(--soft);border-radius:999px;padding:3px 8px}
.row.clear{background:linear-gradient(90deg,#fff7d6,var(--card))}
.row.clear .trophy{font-size:22px;flex:none}
.xppop{position:fixed;z-index:80;pointer-events:none;font-size:18px;font-weight:900;color:var(--acc);text-shadow:0 2px 6px rgba(255,255,255,.9);animation:xpup 1s ease-out forwards}
@keyframes xpup{0%{transform:translateY(0) scale(.8);opacity:0}15%{opacity:1;transform:translateY(-6px) scale(1.15)}100%{transform:translateY(-60px) scale(1);opacity:0}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:90}
.gtoast{position:fixed;left:50%;top:22%;transform:translateX(-50%) scale(.6);z-index:95;background:#111;color:#fff;border-radius:22px;padding:18px 26px;text-align:center;box-shadow:0 16px 40px rgba(0,0,0,.35);animation:tin .35s cubic-bezier(.2,1.4,.4,1) forwards}
.gtoast b{display:block;white-space:nowrap;font-size:26px;font-weight:900;letter-spacing:.04em;background:linear-gradient(90deg,#ffe066,#ff9f43,#ff6b6b);-webkit-background-clip:text;background-clip:text;color:transparent}
.gtoast span{display:block;font-size:14px;font-weight:700;opacity:.85;margin-top:4px}
.gtoast.out{transition:opacity .4s, transform .4s;opacity:0;transform:translateX(-50%) scale(.9)}
@keyframes tin{to{transform:translateX(-50%) scale(1)}}

/* 過去やったこと */
.bars{display:flex;align-items:flex-end;gap:5px;height:96px;background:var(--card);border-radius:16px;padding:12px 12px 22px;box-shadow:var(--shadow);margin-bottom:6px;position:relative}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;cursor:pointer}
.bars .b i{display:block;width:100%;max-width:22px;border-radius:5px 5px 2px 2px;background:var(--ok);min-height:3px}
.bars .b.zero i{background:var(--line)}
.bars .b span{position:absolute;bottom:-17px;font-size:10px;color:var(--sub);font-weight:700}
.bars .b.today span{color:var(--acc)}
.day-h{display:flex;align-items:baseline;gap:8px;margin:20px 4px 8px}
.day-h b{font-size:18px;font-weight:800}
.day-h span{color:var(--sub);font-size:13px;font-weight:700}
</style>
